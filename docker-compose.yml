services:
  postgres:
    image: postgres:18
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_system
      POSTGRES_USER: attendance_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - attendance_data:/var/lib/postgresql

volumes:
  attendance_data:
    external: true
    name: attendance-system_attendance_data
