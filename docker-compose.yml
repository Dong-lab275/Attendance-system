
services:
  postgres:
    image: postgres:18
    container_name: attendance_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: attendance_system
      POSTGRES_USER: attendance_admin
      POSTGRES_PASSWORD: Attendance@2026

    ports:
      - "5433:5432"

    volumes:
      - attendance_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_admin -d attendance_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  attendance_data:
