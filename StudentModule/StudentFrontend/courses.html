
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Courses</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        .container {
            max-width: 390px;
            min-height: 100vh;
            margin: auto;
            padding: 20px 20px 90px;
            background: white;
        }

        h2 {
            color: #123d38;
        }

        .course {
            border: 1px solid #dce5e2;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .course h3 {
            margin-top: 0;
            color: #123d38;
        }

        .course p {
            color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #087f65;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            background: #a0aaa7;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #087f65;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            display: flex;
            justify-content: space-around;
            background: white;
            border-top: 1px solid #dce5e2;
            padding: 16px 5px;
            z-index: 10;
        }

        .bottom-nav a {
            color: #087f65;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>My Courses</h2>
        <p>View your courses and registration status</p>

        <div class="course">
            <h3>Software Engineering</h3>
            <p>Course ID: C0001</p>
            <p>Status: Registered</p>
            <button disabled>Registered</button>
        </div>

        <div class="course">
            <h3>Database Systems</h3>
            <p>Course ID: C0002</p>
            <p>Status: Registered</p>
            <button disabled>Registered</button>
        </div>

        <div class="course">
            <h3>Programming Fundamentals</h3>
            <p>Course ID: C0003</p>
            <p>Status: Not registered</p>
            <button type="button"
                onclick="alert('Registration demo only. Database not connected.')">
                Register (Demo)
            </button>
        </div>

        <a class="back" href="index.html">
            Back to Check-in
        </a>

    </div>

    <nav class="bottom-nav">
        <a href="index.html">Check-in</a>
        <a href="history.html">History</a>
        <a href="courses.html">Courses</a>
        <a href="profile.html">Profile</a>
    </nav>

</body>
</html>
