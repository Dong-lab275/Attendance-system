
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        .container {
            max-width: 390px;
            min-height: 100vh;
            margin: auto;
            padding: 20px 20px 85px;
            background: white;
        }

        h2 {
            color: #123d38;
        }

        .summary {
            background: #e8f6f1;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .percentage {
            font-size: 36px;
            font-weight: bold;
            color: #087f65;
        }

        .record {
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #e1e7e5;
            border-radius: 10px;
        }

        .record p {
            margin: 8px 0;
        }

        .present {
            color: #16845d;
        }

        .late {
            color: #c48412;
        }

        .absent {
            color: #d43b3b;
        }

        .status {
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #087f65;
            text-decoration: none;
            font-weight: bold;
        }

        /* Bottom navigation */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            display: flex;
            justify-content: space-around;
            background: #ffffff;
            border-top: 1px solid #dce5e2;
            padding: 16px 5px;
        }

        .bottom-nav a {
            color: #087f65;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>Attendance History</h2>
        <p>View your attendance records</p>

        <div class="summary">
            <p>Attendance Rate</p>
            <div class="percentage">80%</div>
            <p>8 of 10 sessions attended</p>
        </div>

        <h3>Recent Sessions</h3>

        <div class="record">
            <strong>Software Engineering</strong>
            <p>Session: SE001</p>
            <p class="status absent">Absent</p>
        </div>

        <div class="record">
            <strong>Database Systems</strong>
            <p>Session: DB002</p>
            <p class="status present">Present</p>
        </div>

        <div class="record">
            <strong>Software Engineering</strong>
            <p>Session: SE003</p>
            <p class="status late">Late</p>
        </div>

        <a class="back" href="index.html">
            Back to Check-in
        </a>

    </div>

    <nav class="bottom-nav">
        <a href="index.html">Check-in</a>
        <a href="history.html">History</a>
        <a href="courses.html">Courses</a>
        <a href="profile.html">Profile</a>
    </nav>

</body>
</html>
